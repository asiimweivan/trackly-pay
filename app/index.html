<style>
:root{--hero:#112865;--hero2:#163a7c;--ink:#0f2150;--mut:#5b6685;--teal:#0fa68c;--tealD:#0a8577;--tealL:#2fd1b3;--gold:#f2a50f;--bg:#f4f6fb;--line:#e3e8f2;--mint:#e8f7f3;--err:#c0392b;--card:#fff;--sh:0 1px 2px rgba(15,33,80,.04),0 8px 24px -12px rgba(15,33,80,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.nav{position:sticky;top:0;height:100vh;z-index:40;background:linear-gradient(180deg,#112865 0%,#0e2257 100%);color:#fff;display:flex;flex-direction:column;padding:1.4rem .9rem 1rem}
.brand{display:flex;align-items:center;gap:.7rem}
.brand img{width:40px;height:40px;border-radius:11px;display:block}
.wm{font-weight:800;font-size:1.3rem;letter-spacing:.02em;line-height:1}
.wm i{font-style:normal;color:var(--gold)}
.nav .brand{padding:0 .6rem 1.4rem}
.nav .tag{display:block;font-size:.66rem;font-weight:600;color:#93a3d0;margin-top:4px;letter-spacing:.01em}
.list{display:grid;gap:.2rem}
.ni{display:flex;align-items:center;gap:.8rem;width:100%;padding:.68rem .8rem;border:0;border-radius:12px;background:none;color:#c9d3f0;font-weight:600;font-size:.95rem;text-align:left;transition:background .15s,color .15s}
.ni:hover,.cat:hover>.ni,.cat.open>.ni,.cat:focus-within>.ni{background:rgba(255,255,255,.08);color:#fff}
.ni.on{background:rgba(47,209,179,.17);color:#fff;box-shadow:inset 3px 0 0 var(--tealL)}
.ni .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px!important;height:16px!important;opacity:.55;transition:transform .15s}
.cat.open>.ni .chev{transform:rotate(90deg)}
.lockcount{display:inline-flex;align-items:center;gap:2px;font-size:.72rem;font-weight:800;color:#ffd27a}
.lockcount svg{width:13px;height:13px}
.cat{position:relative}
.sub{position:absolute;left:calc(100% + 10px);top:-8px;min-width:292px;background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 24px 60px -16px rgba(9,20,56,.5),0 0 0 1px rgba(15,33,80,.06);padding:.6rem;display:none;z-index:60}
.sub::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:14px}
.cat:hover>.sub,.cat:focus-within>.sub{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.sub-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.55rem .7rem .6rem;border-bottom:1px solid var(--line);margin-bottom:.35rem}
.sub-h b{font-size:1rem;letter-spacing:-.01em}.sub-h span{font-size:.76rem;color:var(--mut);font-weight:600}
.si{display:flex;align-items:center;gap:.75rem;padding:.55rem .7rem;border-radius:11px;font-weight:600;font-size:.93rem;color:var(--ink);width:100%;border:0;background:none;text-align:left}
.si:hover{background:var(--bg)}
.si .ic{width:34px;height:34px;border-radius:10px;background:var(--mint);color:var(--tealD);display:flex;align-items:center;justify-content:center;flex:none}
.si .ic svg{width:18px;height:18px}
.si .t{flex:1;min-width:0}
.si.lk .ic{background:#f1f3f8;color:#8c97b3}
.si.lk .t{color:#6b7694}
.flame{display:inline-flex;align-items:center;gap:.28rem;font-size:.68rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff8a1f,#ef4444);padding:.16rem .5rem .16rem .38rem;border-radius:99px;white-space:nowrap;box-shadow:0 2px 8px -2px rgba(239,68,68,.5)}
.flame svg{width:12px;height:12px;fill:#fff;stroke:none}
.flame.g{background:linear-gradient(135deg,#f2a50f,#c9822a);box-shadow:0 2px 8px -2px rgba(201,130,42,.55)}
.flame.t{background:linear-gradient(135deg,#0fa68c,#07685d);box-shadow:0 2px 8px -2px rgba(10,133,119,.5)}
.flame.b{background:linear-gradient(135deg,#4f7de8,#1b2a5a);box-shadow:0 2px 8px -2px rgba(27,42,90,.5)}
.upg{margin-top:auto;display:block;border-radius:16px;padding:.95rem 1rem;background:linear-gradient(135deg,rgba(242,165,15,.22),rgba(239,68,68,.16));border:1px solid rgba(242,165,15,.35);color:#fff}
.upg b{display:flex;align-items:center;gap:.4rem;font-size:.93rem}
.upg b svg{width:17px;height:17px;fill:#ffb347;stroke:none}
.upg span{display:block;font-size:.8rem;color:#d6def6;margin-top:.2rem}
.me{margin-top:.8rem;display:flex;align-items:center;gap:.7rem;padding:.7rem .6rem 0;border-top:1px solid rgba(255,255,255,.1);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:#fff;text-align:left}
.me:hover .who b{text-decoration:underline}
.who{min-width:0;display:flex;flex-direction:column;line-height:1.25;flex:1}
.who b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:#93a3d0;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upg+.me{margin-top:.8rem}
.nav:not(:has(.upg)) .me{margin-top:auto}

/* avatar */
.av{position:relative;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0fa68c,#0a8577);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden;font-size:.95rem}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avw{position:relative;flex:none;display:inline-flex}
.vb{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:#1d9bf0;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.vb svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}
.nav .vb{border-color:#112865}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:1rem;padding:.8rem clamp(1rem,3vw,2.6rem);background:rgba(244,246,251,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.sc{border-bottom-color:var(--line)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;align-items:center;justify-content:center}
.top h2{margin:0;font-size:1.05rem;letter-spacing:-.01em}
.top .sp{flex:1}
.ib{position:relative;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:hover{border-color:#c4cde2}
.accb{display:inline-flex;align-items:center;gap:.6rem;border:1px solid var(--line);background:#fff;border-radius:99px;padding:.22rem .7rem .22rem .25rem;font-weight:700;font-size:.9rem}
.accb .av{width:34px;height:34px;font-size:.85rem}
.accb:hover{border-color:#c4cde2}
.acc{position:absolute;right:clamp(1rem,3vw,2.6rem);top:calc(100% - 4px);width:300px;background:#fff;border-radius:18px;box-shadow:0 24px 60px -16px rgba(9,20,56,.4),0 0 0 1px rgba(15,33,80,.06);padding:.6rem;z-index:70}
.acc-h{display:flex;gap:.8rem;align-items:center;padding:.6rem .6rem .8rem;border-bottom:1px solid var(--line);margin-bottom:.4rem}
.acc-h .av{width:48px;height:48px}
.acc-h b{display:block;font-size:.97rem;line-height:1.2}.acc-h small{color:var(--mut);font-size:.8rem}
.acc a,.acc button.row{display:flex;align-items:center;gap:.75rem;width:100%;padding:.6rem .7rem;border-radius:11px;border:0;background:none;font-weight:600;font-size:.92rem;text-align:left}
.acc a:hover,.acc button.row:hover{background:var(--bg)}
.acc .dng{color:#c0392b}
.acc hr{border:0;border-top:1px solid var(--line);margin:.4rem 0}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:800;padding:.14rem .6rem;border-radius:99px;background:var(--pc);color:#fff;margin-top:.25rem}
.chip.lt{background:#eef1f8;color:var(--ink)}

.page{padding:0 clamp(1rem,3vw,2.6rem) 3.4rem;max-width:1320px;width:100%}

/* hero band */
.hero{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 140% at 85% -20%,#1d4fa3 0%,var(--hero) 55%);color:#fff;padding:1.7rem clamp(1.2rem,2.6vw,2.2rem) 1.4rem;margin-top:.6rem}
.hero::before{content:"";position:absolute;right:-8%;top:-60%;width:56%;aspect-ratio:1;border-radius:50%;background:rgba(47,209,179,.1)}
.hero::after{content:"";position:absolute;right:6%;top:-30%;width:34%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}
.hr1{display:flex;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;align-items:flex-start}
.hi{display:flex;align-items:center;gap:.4rem;margin:0;font-size:.88rem;color:#b8c5ea;font-weight:600}
.hi svg{width:15px;height:15px}
.hero h1{margin:.2rem 0 .1rem;font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.035em;line-height:1.08;font-weight:800;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.hero h1 .vb{position:static;width:24px;height:24px;border-color:transparent}
.hero h1 .vb svg{width:13px;height:13px}
.loc{display:flex;align-items:center;gap:.35rem;color:#b8c5ea;font-size:.9rem}
.loc svg{width:15px;height:15px}
.hr-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.45rem}
.dte{font-weight:700;font-size:.95rem;color:#dbe3ff}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.8rem;padding:.3rem .8rem;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff}
.pill svg{width:14px;height:14px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.1);margin-top:1.3rem}
.tabs button{border:0;background:none;color:#c9d3f0;font-weight:700;font-size:.88rem;padding:.5rem 1.1rem;border-radius:10px}
.tabs button[aria-pressed=true]{background:#fff;color:var(--ink)}

/* banners */
.ban{display:flex;align-items:center;gap:.9rem;border-radius:16px;padding:.85rem 1.1rem;margin-top:1rem;font-weight:600;font-size:.92rem}
.ban .bi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.ban.w{background:#fff4e8;border:1px solid #fbd7b0;color:#9a3d0c}.ban.w .bi{background:#ffe6cc}
.ban.r{background:#fdecea;border:1px solid #f5c2bd;color:#a52a1e}.ban.r .bi{background:#fbd5d0}
.ban .tr{height:6px;background:#fbd7b0;border-radius:9px;margin-top:.45rem;overflow:hidden}.ban .tr i{display:block;height:100%;border-radius:9px;background:#f97316}
.ban .go{margin-left:auto;display:flex}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1rem}
.stat{position:relative;overflow:hidden;background:var(--card);border-radius:20px;padding:1.15rem 1.2rem 1.25rem;box-shadow:var(--sh);border:1px solid #edf0f7}
.stat .ti{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--a) 14%,#fff);color:var(--a)}
.stat .v{font-size:clamp(1.6rem,2.2vw,2.1rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:.9rem}
.stat .u{font-size:.8rem;color:var(--mut);font-weight:600;margin-top:.1rem}
.stat .l{font-size:.88rem;font-weight:700;margin-top:.5rem}
.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--a)}
.dl{position:absolute;top:1.1rem;right:1.1rem;display:inline-flex;align-items:center;gap:.2rem;font-size:.75rem;font-weight:800;padding:.18rem .5rem;border-radius:99px}
.dl.up{background:#ecfdf5;color:#059669}.dl.dn{background:#fef2f2;color:#ef4444}.dl svg{width:11px;height:11px;stroke-width:2.6}

/* sections */
.sec{margin-top:2rem}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
.sec-h h3{margin:0;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:.6rem}
.sec-h .cnt{font-size:.75rem;font-weight:800;background:var(--mint);color:var(--tealD);padding:.14rem .6rem;border-radius:99px}
.sec-h .cnt.r{background:#fdecea;color:#c0392b}
.more{display:inline-flex;align-items:center;gap:.2rem;color:var(--tealD);font-weight:700;font-size:.88rem}
.more svg{width:15px;height:15px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem}
.panel{background:var(--card);border-radius:22px;padding:1.3rem;box-shadow:var(--sh);border:1px solid #edf0f7}

/* new sale hero card */
.sale{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center;border-radius:24px;padding:1.4rem 1.5rem;background:linear-gradient(120deg,#0a8577 0%,#0fa68c 60%,#2fd1b3 130%);color:#fff;box-shadow:0 18px 40px -20px rgba(10,133,119,.7);transition:transform .18s}
.sale:hover{transform:translateY(-2px)}
.sale::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09)}
.sale .st{display:flex;align-items:center;gap:1rem}
.sale .sti{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.sale .sti svg{width:28px;height:28px}
.sale h3{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.sale p{margin:.1rem 0 0;opacity:.88;font-size:.92rem}
.sale .ss{display:flex;gap:1.6rem;position:relative;z-index:1}
.sale .ss div{text-align:left}.sale .ss b{display:block;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}.sale .ss span{font-size:.76rem;opacity:.85;font-weight:600}
.sale .go{position:absolute;right:1.4rem;bottom:1.2rem;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--tealD);display:none}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.cc{position:relative;overflow:hidden;display:block;background:var(--card);border-radius:22px;padding:1.2rem;border:1px solid #edf0f7;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s}
.cc:hover{transform:translateY(-3px);box-shadow:0 18px 36px -18px rgba(15,33,80,.3)}
.cc .blob{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--bg2);opacity:.9}
.cc .ct{position:relative;width:50px;height:50px;border-radius:15px;background:var(--bg2);color:var(--cl);display:flex;align-items:center;justify-content:center}
.cc .ct svg{width:25px;height:25px}
.cc h4{position:relative;margin:.9rem 0 0;font-size:1.08rem;letter-spacing:-.015em}
.cc p{position:relative;margin:.1rem 0 .8rem;color:var(--mut);font-size:.84rem;font-weight:600}
.bar{position:relative;display:flex;align-items:center;gap:.5rem}
.bar .tk{flex:1;height:6px;background:#edf0f7;border-radius:9px;overflow:hidden}.bar .tk i{display:block;height:100%;border-radius:9px;background:var(--cl)}
.bar b{font-size:.78rem;color:var(--cl)}
.bar .flame{font-size:.66rem;padding:.1rem .42rem .1rem .3rem}

/* chart */
.ch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.ch-amt{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.ch-amt small{font-size:.9rem;color:var(--mut);font-weight:700}
.ch-sub{color:var(--mut);font-size:.86rem;font-weight:600;margin-top:.15rem}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:.7rem;align-items:end;height:170px;margin-top:1.3rem}
.bc{display:flex;flex-direction:column;align-items:center;gap:.5rem;height:100%;justify-content:flex-end}
.bc .b{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:color-mix(in srgb,var(--teal) 26%,#fff);min-height:5px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc.on .b{background:linear-gradient(180deg,var(--tealL),var(--tealD))}
.bc span{font-size:.78rem;font-weight:700;color:var(--mut)}.bc.on span{color:var(--tealD)}
.empty-n{margin:1rem 0 0;color:var(--mut);font-size:.88rem;text-align:center}

/* lists */
.row{display:flex;align-items:center;gap:.85rem;padding:.75rem 0}
.row+.row{border-top:1px solid #eef1f7}
.row .ri{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--mint);color:var(--tealD)}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .tx small{color:var(--mut);font-size:.8rem;font-weight:600}
.row .am{font-weight:800;color:#059669;font-size:.95rem;white-space:nowrap}
.row .am small{display:block;text-align:right;color:var(--mut);font-weight:600;font-size:.7rem}
.rk{background:#f1f3f8!important;color:#8c97b3!important}.rk.g{background:#fdf3d9!important;color:#c9982a!important}
.emp{text-align:center;padding:1.6rem .5rem}
.emp .ec{width:62px;height:62px;border-radius:50%;background:var(--mint);color:var(--tealD);display:flex;align-items:center;justify-content:center;margin:0 auto .8rem}
.emp .ec svg{width:28px;height:28px}
.emp b{display:block}.emp p{margin:.2rem 0 0;color:var(--mut);font-size:.88rem}
.pb{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;font-size:.93rem;padding:.65rem 1.2rem;border-radius:13px;border:2px solid transparent;min-height:46px}
.pb.p{background:var(--tealD);color:#fff}.pb.p:hover{background:#086d62}
.pb.o{border-color:var(--line);background:#fff;color:var(--ink)}.pb.o:hover{border-color:var(--ink)}
.nudge{display:flex;align-items:center;gap:1rem;border-radius:20px;padding:1.1rem 1.3rem;margin-top:1rem;background:linear-gradient(120deg,#fff8e8,#fff);border:1px solid #f6e2b5}
.nudge .ni2{width:46px;height:46px;border-radius:14px;background:#fdecc4;color:#c9822a;display:flex;align-items:center;justify-content:center}
.nudge .ni2 svg{width:24px;height:24px;fill:#f2a50f;stroke:none}
.nudge b{display:block}.nudge span{color:var(--mut);font-size:.88rem}.nudge .pb{margin-left:auto}

/* pages */
.crumb{display:flex;align-items:center;gap:.4rem;margin:1.2rem 0 .8rem;font-size:.88rem;color:var(--mut);font-weight:600}
.crumb a:hover{color:var(--ink)}
.ph{display:flex;align-items:center;gap:1rem;margin:.2rem 0 1.4rem}
.ph .pi{width:56px;height:56px;border-radius:17px;background:var(--bg2,var(--mint));color:var(--cl,var(--tealD));display:flex;align-items:center;justify-content:center}
.ph .pi svg{width:28px;height:28px}
.ph h1{margin:0;font-size:clamp(1.6rem,2.6vw,2.2rem);letter-spacing:-.03em;line-height:1.1}
.ph p{margin:.15rem 0 0;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.tile{position:relative;display:flex;flex-direction:column;gap:.7rem;align-items:flex-start;background:#fff;border:1px solid #edf0f7;border-radius:20px;padding:1.1rem;box-shadow:var(--sh);text-align:left;transition:transform .18s}
.tile:hover{transform:translateY(-3px)}
.tile .ic{width:48px;height:48px;border-radius:14px;background:var(--mint);color:var(--tealD);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:1rem}
.tile.lk .ic{background:#f1f3f8;color:#8c97b3}.tile.lk b{color:#6b7694}
.tile .flame{position:absolute;top:.9rem;right:.9rem}
.soonc{max-width:620px;margin:3rem auto;text-align:center;background:#fff;border-radius:28px;padding:2.6rem 2rem;box-shadow:var(--sh);border:1px solid #edf0f7}
.soonc .pi{width:84px;height:84px;border-radius:26px;background:var(--mint);color:var(--tealD);display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem}
.soonc .pi svg{width:40px;height:40px}
.soonc h1{margin:0;font-size:1.8rem;letter-spacing:-.03em}.soonc p{color:var(--mut);margin:.5rem auto 1.5rem;max-width:30em}
.soonc .bt{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}

/* profile */
.pcover{position:relative;border-radius:26px;overflow:hidden;background:radial-gradient(120% 160% at 90% -30%,#1d4fa3 0%,var(--hero) 58%);height:160px;margin-top:.6rem}
.pcover::after{content:"";position:absolute;right:-5%;top:-40%;width:40%;aspect-ratio:1;border-radius:50%;background:rgba(47,209,179,.12)}
.pcard{position:relative;margin:-64px 1.6rem 0;display:flex;align-items:flex-start;gap:1.2rem;flex-wrap:wrap}
.pcard .av{width:112px;height:112px;font-size:2.2rem;border:5px solid var(--bg);box-shadow:0 10px 30px -10px rgba(15,33,80,.4)}
.pcard .vb{width:28px;height:28px;right:2px;bottom:4px;border-width:3px;border-color:var(--bg)}.pcard .vb svg{width:14px;height:14px}
.pcard .pn{margin-top:74px}.pcard h1{margin:0;font-size:clamp(1.5rem,2.6vw,2.1rem);letter-spacing:-.03em;line-height:1.1}.pcard p{margin:.1rem 0 .3rem;color:var(--mut);font-weight:600}
.pcard .edit{margin-left:auto;margin-top:74px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1.4rem}
.kv{display:grid;grid-template-columns:1fr;gap:0}
.kv div{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid #eef1f7}
.kv div:first-child{border-top:0}
.kv dt{color:var(--mut);font-weight:600;font-size:.9rem}.kv dd{margin:0;font-weight:700;text-align:right;font-size:.93rem;overflow-wrap:anywhere}
.panel h3{margin:0 0 .6rem;font-size:1.05rem;letter-spacing:-.01em}
.planbox{border-radius:18px;padding:1.2rem;color:#fff;background:linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--pc) 70%,#000));position:relative;overflow:hidden}
.planbox::after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.planbox b{font-size:1.5rem;letter-spacing:-.02em;display:block}.planbox span{opacity:.9;font-size:.88rem;font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,15,30,.62);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fd .18s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.mod{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:#fff;border-radius:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:mp .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes mp{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.mband{position:relative;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.mband::before{content:"";position:absolute;left:-70px;top:-120px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.mband::after{content:"";position:absolute;right:-30px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(0,0,0,.07)}
.mic{position:relative;z-index:1;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.mic svg{width:38px;height:38px}
.mlock{position:absolute;top:14px;right:16px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.mlock svg{width:16px;height:16px}
.mcur{position:absolute;left:16px;bottom:14px;z-index:2;font-size:.72rem;font-weight:800;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);padding:.2rem .7rem;border-radius:99px}
.mx{position:absolute;top:14px;left:16px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center}
.mbody{padding:1.5rem 1.6rem 1.4rem}
.mbody h2{margin:0 0 .4rem;font-size:1.5rem;letter-spacing:-.03em}
.mbody>p{margin:0 0 1.1rem;color:#374151;font-size:.95rem}
.ben{border:1.5px solid color-mix(in srgb,var(--pc) 22%,#fff);background:color-mix(in srgb,var(--pc) 5%,#fff);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1.1rem}
.ben h5{margin:0 0 .7rem;font-size:.78rem;font-weight:800;color:var(--pc);letter-spacing:.02em}
.ben li{list-style:none;display:flex;gap:.6rem;align-items:flex-start;font-size:.88rem;font-weight:600;margin-bottom:.5rem}
.ben ul{margin:0;padding:0}.ben li svg{width:20px;height:20px;padding:4px;border-radius:50%;background:color-mix(in srgb,var(--pc) 18%,#fff);color:var(--pc);stroke-width:3;flex:none;margin-top:1px}
.prow{display:flex;align-items:center;background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:.9rem;margin-bottom:1.1rem}
.prow div{flex:1;text-align:center}.prow b{display:block;font-size:1.2rem;letter-spacing:-.02em}.prow span{font-size:.7rem;color:#9ca3af;font-weight:700}
.prow i{width:1px;height:34px;background:#e5e7eb}
.mcta{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;height:54px;border-radius:15px;border:0;background:var(--pc);color:#fff;font-weight:800;font-size:1rem;box-shadow:0 10px 24px -8px var(--pc)}
.mcta svg{width:18px;height:18px;fill:#fff;stroke:none}
.mlater{display:block;width:100%;padding:.8rem;border:0;background:none;color:#9ca3af;font-weight:600;font-size:.9rem}

.load{display:flex;justify-content:center;padding:6rem 0}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid rgba(15,33,80,.15);border-top-color:var(--tealD);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wake{background:var(--mint);border:1px solid #bfe9df;color:var(--tealD);border-radius:12px;padding:.7rem 1rem;font-weight:600;font-size:.92rem;margin:.8rem 0 0}
.errb{background:#fdecea;border:1px solid #f5c2bd;color:var(--err);border-radius:14px;padding:.9rem 1.1rem;font-weight:600;margin-top:1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between}
.sk{background:linear-gradient(90deg,#eceff6,#f6f8fc,#eceff6);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:1180px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media (max-width:900px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .nav{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .24s ease;overflow-y:auto}
 .nav.open{transform:none;box-shadow:0 0 0 100vmax rgba(5,15,30,.55)}
 .burger{display:inline-flex}
 .sub{position:static;display:none;box-shadow:none;background:rgba(255,255,255,.06);color:#fff;min-width:0;margin:.2rem 0 .4rem;padding:.3rem;border-radius:14px}
 .sub::before{display:none}
 .cat:hover>.sub,.cat:focus-within>.sub{display:none;animation:none}
 .cat.open>.sub{display:block!important}
 .sub-h{display:none}
 .flame{font-size:.62rem}
 .si{color:#e7ecfb}.si:hover{background:rgba(255,255,255,.08)}
 .si .ic{background:rgba(47,209,179,.18);color:var(--tealL)}.si.lk .ic{background:rgba(255,255,255,.08);color:#93a3d0}.si.lk .t{color:#a9b5d6}
 .acc{right:1rem}
 .sale{grid-template-columns:1fr}
 .pgrid{grid-template-columns:1fr}
}
@media (max-width:560px){
 .stats{grid-template-columns:1fr 1fr;gap:.7rem}.stat{padding:1rem}.stat .v{font-size:1.45rem}
 .sale .ss{gap:1.1rem}.hr-r{align-items:flex-start;text-align:left}
 .accb span{display:none}.accb{padding:.22rem}
 .pcard{margin:-56px .6rem 0}.pcard .av{width:96px;height:96px}.pcard .pn{margin-top:60px}.pcard .edit{margin-left:0;margin-top:0;width:100%}
 .nudge{flex-wrap:wrap}.nudge .pb{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function ApiErr(s){this.status=s}
function refresh(){
 var r=g("r");if(!r)return Promise.reject(new ApiErr(401));
 return fetch(API+"/auth/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refreshToken:r})}).then(function(x){
  if(!x.ok)throw new ApiErr(401);return x.json()}).then(function(j){
  if(!j.accessToken)throw new ApiErr(401);
  try{localStorage.setItem(KEYS.a,j.accessToken);if(j.refreshToken)localStorage.setItem(KEYS.r,j.refreshToken)}catch(e){}
  return j.accessToken});
}
function get(path,retry){
 return fetch(API+path,{headers:{Authorization:"Bearer "+g("a")}}).then(function(r){
  if(r.status===401&&!retry)return refresh().then(function(){return get(path,true)});
  if(r.status===401||r.status===403)throw new ApiErr(401);
  if(!r.ok)throw new ApiErr(r.status);
  return r.json();
 });
}

 h+='<section class="sec cols"><div class="panel"><div class="sec-h" style="margin-bottom:.2rem"><h3>'+esc(t.weekT)+'</h3><a class="more" href="#/s/reports">'+esc(t.full)+ico("chev")+'</a></div>'+
  '<div class="ch-top"><div><div class="ch-amt">'+esc(fmtC(wkTot))+' <small>RWF</small></div><div class="ch-sub">'+(wkTot===0?esc(t.nosales):esc(t.wk)+' · '+esc(t.todayAmt)+': '+esc(fmtC(revT))+' RWF')+'</div></div>'+(growth!==null?'<span class="dl '+(growth>=0?"up":"dn")+'" style="position:static">'+ico(growth>=0?"up":"dn")+Math.abs(growth)+'%</span>':"")+'</div>'+
  '<div class="bars">'+bars.map(function(v,i){var mx=Math.max.apply(null,bars.concat([1]));return '<div class="bc'+(i===(now.getDay()+6)%7?" on":"")+'" title="'+esc(fmtN(v))+' RWF"><div class="b" style="height:'+Math.max(v/mx*100,3)+'%"></div><span>'+t.days[i]+'</span></div>'}).join("")+'</div></div>'+
  '<div class="panel"><div class="sec-h" style="margin-bottom:.2rem"><h3>'+esc(t.alerts)+(alerts.length?'<span class="cnt r">'+alerts.length+'</span>':"")+'</h3><a class="more" href="#/s/stock-alerts">'+esc(t.seeall)+ico("chev")+'</a></div>'+
  (alerts.length?alerts.map(function(a){var em=Number(a.stockQuantity)===0;return '<div class="row"><span class="ri" style="background:'+(em?"#fdecea":"#fff1e4")+';color:'+(em?"#ef4444":"#f97316")+'">'+ico("alert")+'</span><span class="tx"><b>'+esc(a.name)+'</b><small>'+esc(em?t.out:t.low)+'</small></span><span class="am" style="color:'+(em?"#ef4444":"#f97316")+'">'+esc(a.stockQuantity)+'<small>'+esc(t.left)+'</small></span></div>'}).join(""):
  '<div class="emp"><span class="ec">'+ico("check")+'</span><b>'+esc(t.allok)+'</b><p>'+esc(P.length?t.allokSub:t.addp)+'</p></div>')+'</div></section>';
 h+='<section class="sec cols"><div class="panel"><div class="sec-h" style="margin-bottom:.2rem"><h3>'+esc(t.recent)+'</h3><a class="more" href="#/s/invoice-history">'+esc(t.viewall)+ico("chev")+'</a></div>'+
  (recent.length?recent.map(function(s){var f=(s.items||[])[0]||{},ex=(s.items||[]).length-1;return '<div class="row"><span class="ri">'+ico("bag")+'</span><span class="tx"><b>'+esc(f.productName||lbl("new-sale"))+(ex>0?' +'+ex+' '+esc(t.more):"")+'</b><small>'+esc(s._d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}))+' · '+esc(sameDay(s._d,now)?"":s._d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" · ")+esc(s.paymentMethod||t.cash)+'</small></span><span class="am">+'+esc(fmtC(s.total))+'</span></div>'}).join(""):
  '<div class="emp"><span class="ec">'+ico("receipt")+'</span><b>'+esc(t.nosy)+'</b><p>'+esc(t.nosySub)+'</p></div>')+'</div>'+
  '<div class="panel"><div class="sec-h" style="margin-bottom:.2rem"><h3>'+esc(t.top)+'</h3><a class="more" href="#/s/inventory">'+esc(lbl("inventory"))+ico("chev")+'</a></div>'+
  (top.length?top.map(function(x,i){return '<div class="row"><span class="ri rk'+(i===0?" g":"")+'">'+ico("trophy")+'</span><span class="tx"><b>'+esc(x.n)+'</b><small>'+x.q+' '+esc(t.sold)+'</small></span><span class="am" style="color:var(--ink)">'+esc(fmtC(x.r))+'<small>RWF</small></span></div>'}).join(""):'<div class="emp"><span class="ec">'+ico("trophy")+'</span><b>'+esc(t.nosy)+'</b></div>')+'</div></section>';
 return h;
}

function vCat(k){
 var c=CATS.filter(function(x){return x.k===k})[0],t=tx();if(!c)return vHome();
 var lk=c.items.filter(function(d){return !can(S.plan,d)}).length;
 return crumb(t.cats[k])+'<div class="ph" style="--cl:'+c.c+';--bg2:'+c.bg+'"><span class="pi">'+ico(c.icon)+'</span><div><h1>'+esc(t.cats[k])+'</h1><p>'+esc(fill(t.avail,{u:c.items.length-lk,t:c.items.length}))+'</p></div></div><div class="tiles">'+
  c.items.map(function(d){var l=!can(S.plan,d),gt=GATE[d];return '<a class="tile'+(l?" lk":"")+'" href="#/s/'+d+'" data-d="'+d+'">'+(l?flame(gt[2]):"")+'<span class="ic">'+ico(gt[1])+'</span><b>'+esc(lbl(d))+'</b></a>'}).join("")+'</div>';
}
function vSvc(d){
 var t=tx(),gt=GATE[d];
 if(!can(S.plan,d)){setTimeout(function(){modal(d)},0)}
 var cat=CATS.filter(function(c){return c.items.indexOf(d)>-1})[0];
 return crumb(lbl(d))+'<div class="soonc"><span class="pi">'+ico(gt[1])+'</span><h1>'+esc(lbl(d))+'</h1><p>'+esc(fill(t.soonX,{n:lbl(d)}))+'</p><div class="bt"><a class="pb p" href="/get">'+ico("dl")+esc(t.dlA)+'</a><a class="pb o" href="'+(cat?'#/c/'+cat.k:'#/')+'">'+esc(t.back)+'</a></div></div>';
}
function vProfile(){
 var t=tx(),b=S.biz||{},u=S.user||{},p=PLAN[S.plan],sub=S.sub;
 function kv(a){return '<dl class="kv">'+a.filter(function(x){return x[1]}).map(function(x){return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join("")+'</dl>'}
 var loc=[b.village,b.cell,b.sector,b.district,b.province].filter(Boolean).join(", ");
 var since=b.createdAt?pdate(b.createdAt).toLocaleDateString(lang==="rw"?"en-GB":lang,{day:"numeric",month:"long",year:"numeric"}):"";
 var ps=S.plan==="ubuntu"?t.free:(sub&&sub.daysRemaining!=null?fill(t.daysLeft,{d:sub.daysRemaining}):t.active);
 return crumb(t.prof)+'<div class="pcover"></div><div class="pcard">'+avatar(b.logoUrl,uname(),b.isVerified,112)+'<div class="pn"><h1>'+esc(uname())+'</h1><p>'+esc(b.name||t.owner)+'</p><span class="chip" style="--pc:'+(S.plan==="ubuntu"?"#64748b":p.color)+'">'+ico("diamond").replace('class="i"','class="i" style="width:11px;height:11px"')+esc(p.label)+'</span></div><span class="edit"><span class="pb o" style="cursor:default">'+ico("gear")+esc(t.editApp)+'</span></span></div>'+
 '<div class="pgrid"><div class="panel"><h3>'+esc(t.ownInfo)+'</h3>'+kv([[t.owner,uname()],[t.phone,u.phone],[t.email,u.email]])+'</div>'+
 '<div class="panel"><h3>'+esc(t.planInfo)+'</h3><div class="planbox" style="--pc:'+p.color+'"><b>'+esc(p.label)+'</b><span>'+esc(ps)+'</span></div>'+(RANK[S.plan]<3?'<p style="margin:.9rem 0 0"><a class="pb p" href="/home.html#pricing">'+ico("bolt").replace("<svg","<svg")+esc(t.upgrade)+'</a></p>':"")+'</div>'+
 '<div class="panel" style="grid-column:1/-1"><h3>'+esc(t.bizInfo)+'</h3>'+kv([[t.bizName,b.name],[t.type,BIZT[b.category]||b.category],[t.loc,loc],[t.phone,b.phone],[t.email,b.email],[t.tin,b.tinNumber],[t.vat,b.isVatRegistered?t.yes:t.no],[t.cur,b.currency],[t.since,since]])+'</div></div>';
}

/* ---------- draw ---------- */
function draw(){
 document.documentElement.lang=lang;document.title="Trackly";
 buildNav();topbar();
 $("#page").innerHTML=view();
 $$("[data-t=tag]").forEach(function(e){e.textContent=tx().tag});
 var rt=$("#rt");if(rt)rt.addEventListener("click",load);
 $$("[data-tab]").forEach(function(b){b.addEventListener("click",function(){S.tab=b.getAttribute("data-tab");draw()})});
 $$(".tile").forEach(function(a){a.addEventListener("click",function(e){var d=a.getAttribute("data-d");if(!can(S.plan,d)){e.preventDefault();modal(d)}})});
 closeNav();
}
load();
})();
</script>
</body>
