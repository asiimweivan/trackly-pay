<style>
:root{--hero:#112865;--hero2:#163a7c;--ink:#0f2150;--mut:#5b6685;--teal:#0fa68c;--tealD:#0a8577;--tealL:#2fd1b3;--gold:#f2a50f;--bg:#f4f6fb;--line:#e3e8f2;--mint:#e8f7f3;--err:#c0392b;--card:#fff;--sh:0 1px 2px rgba(15,33,80,.04),0 8px 24px -12px rgba(15,33,80,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.nav{position:sticky;top:0;height:100vh;z-index:40;background:linear-gradient(180deg,#112865 0%,#0e2257 100%);color:#fff;display:flex;flex-direction:column;padding:1.4rem .9rem 1rem}
.brand{display:flex;align-items:center;gap:.7rem}
.brand img{width:40px;height:40px;border-radius:11px;display:block}
.wm{font-weight:800;font-size:1.3rem;letter-spacing:.02em;line-height:1}
.wm i{font-style:normal;color:var(--gold)}
.nav .brand{padding:0 .6rem 1.4rem}
.nav .tag{display:block;font-size:.66rem;font-weight:600;color:#93a3d0;margin-top:4px;letter-spacing:.01em}
.list{display:grid;gap:.2rem}
.ni{display:flex;align-items:center;gap:.8rem;width:100%;padding:.68rem .8rem;border:0;border-radius:12px;background:none;color:#c9d3f0;font-weight:600;font-size:.95rem;text-align:left;transition:background .15s,color .15s}
.ni:hover,.cat:hover>.ni,.cat.open>.ni,.cat:focus-within>.ni{background:rgba(255,255,255,.08);color:#fff}
.ni.on{background:rgba(47,209,179,.17);color:#fff;box-shadow:inset 3px 0 0 var(--tealL)}
.ni .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px!important;height:16px!important;opacity:.55;transition:transform .15s}
.cat.open>.ni .chev{transform:rotate(90deg)}
.lockcount{display:inline-flex;align-items:center;gap:2px;font-size:.72rem;font-weight:800;color:#ffd27a}
.lockcount svg{width:13px;height:13px}
.cat{position:relative}
.flame{display:inline-flex;align-items:center;gap:.28rem;font-size:.68rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff8a1f,#ef4444);padding:.16rem .5rem .16rem .38rem;border-radius:99px;white-space:nowrap;box-shadow:0 2px 8px -2px rgba(239,68,68,.5)}
.flame svg{width:12px;height:12px;fill:#fff;stroke:none}
.flame.g{background:linear-gradient(135deg,#f2a50f,#c9822a);box-shadow:0 2px 8px -2px rgba(201,130,42,.55)}
.flame.t{background:linear-gradient(135deg,#0fa68c,#07685d);box-shadow:0 2px 8px -2px rgba(10,133,119,.5)}
.flame.b{background:linear-gradient(135deg,#4f7de8,#1b2a5a);box-shadow:0 2px 8px -2px rgba(27,42,90,.5)}
.upg{margin-top:auto;display:block;border-radius:16px;padding:.95rem 1rem;background:linear-gradient(135deg,rgba(242,165,15,.22),rgba(239,68,68,.16));border:1px solid rgba(242,165,15,.35);color:#fff}
.upg b{display:flex;align-items:center;gap:.4rem;font-size:.93rem}
.upg b svg{width:17px;height:17px;fill:#ffb347;stroke:none}
.upg span{display:block;font-size:.8rem;color:#d6def6;margin-top:.2rem}
.me{margin-top:.8rem;display:flex;align-items:center;gap:.7rem;padding:.7rem .6rem 0;border-top:1px solid rgba(255,255,255,.1);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:#fff;text-align:left}
.me:hover .who b{text-decoration:underline}
.who{min-width:0;display:flex;flex-direction:column;line-height:1.25;flex:1}
.who b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:#93a3d0;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upg+.me{margin-top:.8rem}
.nav:not(:has(.upg)) .me{margin-top:auto}

/* avatar */
.av{position:relative;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0fa68c,#0a8577);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden;font-size:.95rem}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avw{position:relative;flex:none;display:inline-flex}
.vb{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:#1d9bf0;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.vb svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}
.nav .vb{border-color:#112865}


/* sidebar accordion */
.nav{overflow:hidden}
.list{flex:1;min-height:0;align-content:start;overflow-y:auto;overflow-x:hidden;margin:0 -.4rem;padding:0 .4rem 1rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:9px}
.cat.open>.ni{background:rgba(255,255,255,.1);color:#fff}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s cubic-bezier(.3,.7,.2,1)}
.sub>.in{overflow:hidden;min-height:0;margin-left:1.5rem;padding-left:.55rem;border-left:1.5px solid rgba(47,209,179,.35)}
.cat.open>.sub{grid-template-rows:1fr}
.cat.open>.sub>.in{padding-top:.3rem;padding-bottom:.45rem}
.cn{font-size:.72rem;font-weight:700;color:#8fa0cf}
.si{display:flex;align-items:center;gap:.6rem;padding:.4rem .5rem;border-radius:11px;font-weight:600;font-size:.86rem;color:#dbe3ff;width:100%;transition:background .15s}
.si:hover{background:rgba(255,255,255,.09);color:#fff}
.si .ic{width:28px;height:28px;border-radius:9px;background:rgba(47,209,179,.16);color:var(--tealL);display:flex;align-items:center;justify-content:center;flex:none}
.si .ic svg{width:16px;height:16px}
.si .t{flex:1;min-width:0;line-height:1.25}
.si.lk{color:#9fb0da}
.si.lk .ic{background:rgba(255,255,255,.07);color:#8c9cc6}
.si .flame{font-size:.62rem;padding:.12rem .45rem .12rem .32rem}
.si.cur{background:rgba(47,209,179,.16);color:#fff}


.sl{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7f91c4;padding:.9rem .8rem .35rem}
.sl:first-child{padding-top:.1rem}
.nt{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);transition:background .15s}
.nt svg{width:18px;height:18px}
.ni{padding:.45rem .6rem;gap:.75rem}
.ni:hover .nt,.cat.open>.ni .nt,.ni.on .nt{background:color-mix(in srgb,var(--tc) 26%,transparent)}
.ni.on{box-shadow:none;background:linear-gradient(90deg,rgba(47,209,179,.22),rgba(47,209,179,.06))}
.lockcount{background:rgba(255,178,71,.16);border:1px solid rgba(255,178,71,.3);padding:.12rem .45rem;border-radius:99px;gap:3px}
.nav .brand{padding:.1rem .6rem 1.1rem;margin-bottom:.5rem;border-bottom:1px solid rgba(255,255,255,.08)}
.me{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:.6rem .7rem;margin-top:.7rem;width:100%}
.me:hover{background:rgba(255,255,255,.11)}
.me:hover .who b{text-decoration:none}
.me .av{box-shadow:0 0 0 2px rgba(47,209,179,.55)}
.nav:not(:has(.upg)) .me{margin-top:.7rem}
.upg{margin-top:.5rem}
.upg+.me{margin-top:.6rem}
.nav .list{padding-bottom:.6rem}

@media (max-height:980px) and (min-width:901px){.upg span{display:none}.upg{padding:.7rem .9rem}}
/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:1rem;padding:.8rem clamp(1rem,3vw,2.6rem);background:rgba(244,246,251,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.sc{border-bottom-color:var(--line)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;align-items:center;justify-content:center}
.top h2{margin:0;font-size:1.05rem;letter-spacing:-.01em}
.top .sp{flex:1}
.ib{position:relative;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:hover{border-color:#c4cde2}
.accb{display:inline-flex;align-items:center;gap:.6rem;border:1px solid var(--line);background:#fff;border-radius:99px;padding:.22rem .7rem .22rem .25rem;font-weight:700;font-size:.9rem}
.accb .av{width:34px;height:34px;font-size:.85rem}
.accb:hover{border-color:#c4cde2}
.acc{position:absolute;right:clamp(1rem,3vw,2.6rem);top:calc(100% - 4px);width:300px;background:#fff;border-radius:18px;box-shadow:0 24px 60px -16px rgba(9,20,56,.4),0 0 0 1px rgba(15,33,80,.06);padding:.6rem;z-index:70}
.acc-h{display:flex;gap:.8rem;align-items:center;padding:.6rem .6rem .8rem;border-bottom:1px solid var(--line);margin-bottom:.4rem}
.acc-h .av{width:48px;height:48px}
.acc-h b{display:block;font-size:.97rem;line-height:1.2}.acc-h small{color:var(--mut);font-size:.8rem}
.acc a,.acc button.row{display:flex;align-items:center;gap:.75rem;width:100%;padding:.6rem .7rem;border-radius:11px;border:0;background:none;font-weight:600;font-size:.92rem;text-align:left}
.acc a:hover,.acc button.row:hover{background:var(--bg)}
.acc .dng{color:#c0392b}
.acc hr{border:0;border-top:1px solid var(--line);margin:.4rem 0}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:800;padding:.14rem .6rem;border-radius:99px;background:var(--pc);color:#fff;margin-top:.25rem}
.chip.lt{background:#eef1f8;color:var(--ink)}

.page{padding:0 clamp(1rem,3vw,2.6rem) 3.4rem;max-width:1320px;width:100%}

/* hero band */
.hero{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 140% at 85% -20%,#1d4fa3 0%,var(--hero) 55%);color:#fff;padding:1.7rem clamp(1.2rem,2.6vw,2.2rem) 1.4rem;margin-top:.6rem}
.hero::before{content:"";position:absolute;right:-8%;top:-60%;width:56%;aspect-ratio:1;border-radius:50%;background:rgba(47,209,179,.1)}
.hero::after{content:"";position:absolute;right:6%;top:-30%;width:34%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}
.hr1{display:flex;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;align-items:flex-start}
.hi{display:flex;align-items:center;gap:.4rem;margin:0;font-size:.88rem;color:#b8c5ea;font-weight:600}
.hi svg{width:15px;height:15px}
.hero h1{margin:.2rem 0 .1rem;font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.035em;line-height:1.08;font-weight:800;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.hero h1 .vb{position:static;width:24px;height:24px;border-color:transparent}
.hero h1 .vb svg{width:13px;height:13px}
.loc{display:flex;align-items:center;gap:.35rem;color:#b8c5ea;font-size:.9rem}
.loc svg{width:15px;height:15px}
.hr-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.45rem}
.dte{font-weight:700;font-size:.95rem;color:#dbe3ff}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.8rem;padding:.3rem .8rem;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff}
.pill svg{width:14px;height:14px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.1);margin-top:1.3rem}
.tabs button{border:0;background:none;color:#c9d3f0;font-weight:700;font-size:.88rem;padding:.5rem 1.1rem;border-radius:10px}
.tabs button[aria-pressed=true]{background:#fff;color:var(--ink)}

/* banners */
.ban{display:flex;align-items:center;gap:.9rem;border-radius:16px;padding:.85rem 1.1rem;margin-top:1rem;font-weight:600;font-size:.92rem}
.ban .bi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.ban.w{background:#fff4e8;border:1px solid #fbd7b0;color:#9a3d0c}.ban.w .bi{background:#ffe6cc}
.ban.r{background:#fdecea;border:1px solid #f5c2bd;color:#a52a1e}.ban.r .bi{background:#fbd5d0}
.ban .tr{height:6px;background:#fbd7b0;border-radius:9px;margin-top:.45rem;overflow:hidden}.ban .tr i{display:block;height:100%;border-radius:9px;background:#f97316}
.ban .go{margin-left:auto;display:flex}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1rem}
.stat{position:relative;overflow:hidden;background:var(--card);border-radius:20px;padding:1.15rem 1.2rem 1.25rem;box-shadow:var(--sh);border:1px solid #edf0f7}
.stat .ti{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--a) 14%,#fff);color:var(--a)}
.stat .v{font-size:clamp(1.6rem,2.2vw,2.1rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:.9rem}
.stat .u{font-size:.8rem;color:var(--mut);font-weight:600;margin-top:.1rem}
.stat .l{font-size:.88rem;font-weight:700;margin-top:.5rem}
.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--a)}
.dl{position:absolute;top:1.1rem;right:1.1rem;display:inline-flex;align-items:center;gap:.2rem;font-size:.75rem;font-weight:800;padding:.18rem .5rem;border-radius:99px}
.dl.up{background:#ecfdf5;color:#059669}.dl.dn{background:#fef2f2;color:#ef4444}.dl svg{width:11px;height:11px;stroke-width:2.6}

/* sections */
.sec{margin-top:2rem}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
.sec-h h3{margin:0;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:.6rem}
.sec-h .cnt{font-size:.75rem;font-weight:800;background:var(--mint);color:var(--tealD);padding:.14rem .6rem;border-radius:99px}
.sec-h .cnt.r{background:#fdecea;color:#c0392b}
.more{display:inline-flex;align-items:center;gap:.2rem;color:var(--tealD);font-weight:700;font-size:.88rem}
.more svg{width:15px;height:15px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem}
.panel{background:var(--card);border-radius:22px;padding:1.3rem;box-shadow:var(--sh);border:1px solid #edf0f7}

/* new sale hero card */
.sale{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center;border-radius:24px;padding:1.4rem 1.5rem;background:linear-gradient(120deg,#0a8577 0%,#0fa68c 60%,#2fd1b3 130%);color:#fff;box-shadow:0 18px 40px -20px rgba(10,133,119,.7);transition:transform .18s}
.sale:hover{transform:translateY(-2px)}
.sale::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09)}
.sale .st{display:flex;align-items:center;gap:1rem}
.sale .sti{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.sale .sti svg{width:28px;height:28px}
.sale h3{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.sale p{margin:.1rem 0 0;opacity:.88;font-size:.92rem}
.sale .ss{display:flex;gap:1.6rem;position:relative;z-index:1}
.sale .ss div{text-align:left}.sale .ss b{display:block;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}.sale .ss span{font-size:.76rem;opacity:.85;font-weight:600}
.sale .go{position:absolute;right:1.4rem;bottom:1.2rem;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--tealD);display:none}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.cc{position:relative;overflow:hidden;display:block;background:var(--card);border-radius:22px;padding:1.2rem;border:1px solid #edf0f7;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s}
.cc:hover{transform:translateY(-3px);box-shadow:0 18px 36px -18px rgba(15,33,80,.3)}
.cc .blob{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--bg2);opacity:.9}
.cc .ct{position:relative;width:50px;height:50px;border-radius:15px;background:var(--bg2);color:var(--cl);display:flex;align-items:center;justify-content:center}
.cc .ct svg{width:25px;height:25px}
.cc h4{position:relative;margin:.9rem 0 0;font-size:1.08rem;letter-spacing:-.015em}
.cc p{position:relative;margin:.1rem 0 .8rem;color:var(--mut);font-size:.84rem;font-weight:600}
.bar{position:relative;display:flex;align-items:center;gap:.5rem}
.bar .tk{flex:1;height:6px;background:#edf0f7;border-radius:9px;overflow:hidden}.bar .tk i{display:block;height:100%;border-radius:9px;background:var(--cl)}
.bar b{font-size:.78rem;color:var(--cl)}
.bar .flame{font-size:.66rem;padding:.1rem .42rem .1rem .3rem}

/* chart */
.ch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.ch-amt{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.ch-amt small{font-size:.9rem;color:var(--mut);font-weight:700}
.ch-sub{color:var(--mut);font-size:.86rem;font-weight:600;margin-top:.15rem}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:.7rem;align-items:end;height:170px;margin-top:1.3rem}
.bc{display:flex;flex-direction:column;align-items:center;gap:.5rem;height:100%;justify-content:flex-end}
.bc .b{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:color-mix(in srgb,var(--teal) 26%,#fff);min-height:5px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc.on .b{background:linear-gradient(180deg,var(--tealL),var(--tealD))}
.bc span{font-size:.78rem;font-weight:700;color:var(--mut)}.bc.on span{color:var(--tealD)}
.empty-n{margin:1rem 0 0;color:var(--mut);font-size:.88rem;text-align:center}

/* lists */
.row{display:flex;align-items:center;gap:.85rem;padding:.75rem 0}
.row+.row{border-top:1px solid #eef1f7}

/* pages */

@media (max-width:1180px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media (max-width:900px){

 .nav.open{transform:none;box-shadow:0 0 0 100vmax rgba(5,15,30,.55)}

}
@media (max-width:900px){.si .flame{font-size:0;gap:0;padding:0;width:28px;height:22px;justify-content:center;flex:none;overflow:hidden}.si .flame svg{width:13px;height:13px}}
@media (max-width:560px){

 .pcard{margin:-56px .6rem 0}.pcard .av{width:96px;height:96px}.pcard .pn{margin-top:60px}.pcard .edit{margin-left:0;margin-top:0;width:100%}

}

/* point of sale */

.pbar svg{color:var(--mut)}.pbar input{flex:1;border:0;outline:0;background:none;font:inherit;font-weight:600;font-size:1rem;color:var(--ink);min-width:0}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.9rem 0 0}

.pc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-align:left;background:#fff;border:1.5px solid #edf0f7;border-radius:18px;padding:.9rem;box-shadow:var(--sh);transition:transform .14s,border-color .14s}
.pc:hover{transform:translateY(-2px);border-color:var(--teal)}.pc:active{transform:scale(.98)}
.pc .pt{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 55% 32%)}

.pc .ps{font-size:.75rem;font-weight:700;color:var(--tealD)}.pc .ps.lo{color:#d9480f}
.qb{position:absolute;top:.6rem;right:.6rem;min-width:26px;height:26px;border-radius:99px;background:var(--tealD);color:#fff;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;padding:0 .4rem;box-shadow:0 4px 10px -2px rgba(10,133,119,.6)}
.pos-r{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;background:#fff;border:1px solid #edf0f7;border-radius:24px;box-shadow:0 18px 44px -22px rgba(15,33,80,.3);overflow:hidden}
.ct-h{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.2rem .6rem}
.ct-h h3{margin:0;font-size:1.1rem;display:flex;align-items:center;gap:.5rem}.ct-h .cnt{background:var(--mint);color:var(--tealD);font-size:.75rem;padding:.1rem .55rem;border-radius:99px}

.ci{padding:.75rem 0;border-top:1px solid #eef1f7}.ci:first-child{border-top:0}
.ci-t{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}.ci-t b{font-size:.92rem;line-height:1.3}
.ci .x{border:0;background:none;color:#9aa4bd;width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center}.ci .x:hover{background:#fdecea;color:#c0392b}.ci .x svg{width:15px;height:15px}
.ci-b{display:flex;align-items:center;gap:.7rem;margin-top:.5rem}
.stp{display:inline-flex;align-items:center;background:var(--bg);border-radius:12px}
.stp button{width:34px;height:34px;border:0;background:none;font-size:1.2rem;font-weight:700;border-radius:12px;color:var(--ink)}.stp button:hover{background:#e3e8f2}
.stp span{min-width:28px;text-align:center;font-weight:800}
.ci-p{flex:1}.pe{border:1px dashed #cdd5e6;background:#fff;border-radius:9px;padding:.2rem .5rem;font-size:.8rem;font-weight:700;color:var(--mut)}.pe:hover{border-color:var(--teal);color:var(--ink)}.pe.ng{color:var(--tealD);border-color:#9fdccf;background:var(--mint)}.pe s{opacity:.55;margin-right:.2rem}

.err2{margin:.5rem 1.2rem 0;background:#fdecea;border:1px solid #f5c2bd;color:#c0392b;border-radius:11px;padding:.55rem .8rem;font-weight:600;font-size:.86rem}
.ct-f{padding:.9rem 1.2rem 1.2rem;border-top:1px solid #eef1f7;overflow-y:auto;min-height:0}
.fld{margin-bottom:.9rem}.fld label,.lab2{display:block;font-weight:700;font-size:.82rem;color:var(--mut);margin-bottom:.35rem}
.sel{width:100%;height:46px;border:1.5px solid #dfe5f1;border-radius:12px;background:#fff;font:inherit;font-weight:600;padding:0 .8rem;color:var(--ink)}.sel:focus{outline:0;border-color:var(--teal)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.pm button{display:flex;align-items:center;justify-content:center;gap:.5rem;height:46px;border:1.5px solid #dfe5f1;background:#fff;border-radius:12px;font-weight:700;font-size:.9rem;color:var(--mut)}
.pm button svg{width:18px;height:18px}.pm button[aria-pressed=true]{border-color:var(--teal);background:var(--mint);color:var(--tealD)}
.cashin{display:flex;align-items:center;gap:.6rem;border:2px solid #dfe5f1;border-radius:14px;height:56px;padding:0 .9rem;background:#fafbfd}.cashin:focus-within{border-color:var(--teal)}

.charge{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--tealD),var(--teal));color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 14px 28px -12px rgba(10,133,119,.7)}

.done{max-width:880px;margin:1.4rem auto 0}
.dn-h{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}.dn-i{width:62px;height:62px;border-radius:50%;background:var(--mint);color:var(--tealD);display:flex;align-items:center;justify-content:center;animation:pp .4s cubic-bezier(.2,.9,.3,1.3)}

.dn-i svg{width:32px;height:32px;stroke-width:2.6}.dn-h h1{margin:0;font-size:1.7rem;letter-spacing:-.03em}.dn-h p{margin:.1rem 0 0;color:var(--mut);font-weight:600}

.rcpt{background:#fff;border-radius:20px;padding:1.6rem 1.5rem;box-shadow:var(--sh);border:1px solid #edf0f7;position:relative}
.rcpt::before{content:"";position:absolute;left:0;right:0;top:-1px;height:8px;background:radial-gradient(circle at 8px 0,transparent 6px,#fff 6.5px) 0 0/16px 8px repeat-x}

.qot td:nth-child(n+2),.qot th:nth-child(n+2){text-align:right}

function ApiErr(s){this.status=s}
function refresh(){

 return fetch(API+"/auth/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refreshToken:r})}).then(function(x){
  if(!x.ok)throw new ApiErr(401);return x.json()}).then(function(j){

  try{localStorage.setItem(KEYS.a,j.accessToken);if(j.refreshToken)localStorage.setItem(KEYS.r,j.refreshToken)}catch(e){}
  return j.accessToken});
}
function get(path,retry){
 return fetch(API+path,{headers:{Authorization:"Bearer "+g("a")}}).then(function(r){
  if(r.status===401&&!retry)return refresh().then(function(){return get(path,true)});
  if(r.status===401||r.status===403)throw new ApiErr(401);
  if(!r.ok)throw new ApiErr(r.status);

function post(path,body,retry){
 return fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+g("a")},body:JSON.stringify(body)}).then(function(r){
  return r.text().then(function(txt){
   var j;try{j=JSON.parse(txt)}catch(e){j=txt}
   if(r.status===401&&!retry)return refresh().then(function(){return post(path,body,true)});
   if(!r.ok){var e=new ApiErr(r.status);e.msg=(j&&(j.message||j.error))||"";throw e}
   return j;
  });
 });
}

function cashChips(g){

 [10000,20000,50000,100000].forEach(function(v){if(v>g&&a.indexOf(v)<0)a.push(v)});
 return a.sort(function(x,y){return x-y}).slice(0,5);
}

function send(method,path,body,retry){
 var o={method:method,headers:{Authorization:"Bearer "+g("a")}};
 if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
 return fetch(API+path,o).then(function(r){
  return r.text().then(function(txt){
   var j;try{j=txt?JSON.parse(txt):null}catch(e){j=txt}
   if(r.status===401&&!retry)return refresh().then(function(){return send(method,path,body,true)});
   if(!r.ok){var e=new ApiErr(r.status);e.msg=(j&&(j.message||j.error))||"";throw e}
   return j;
  });
 });
}
function prodStatus(p){
 var q=Number(p.stockQuantity||0),m=Number(p.minStockLevel||0);
 if(p.isService)return"svc";if(q<=0)return"out";if(q<=m)return"low";return"ok";
}
function invStats(){
 var l=S.products,s={total:l.length,ok:0,low:0,out:0,val:0,cost:0};
 l.forEach(function(p){var st=prodStatus(p);if(st==="ok"||st==="svc")s.ok++;else s[st]++;
  if(!p.isService){var q=Number(p.stockQuantity||0);s.val+=q*Number(p.sellingPrice||0);s.cost+=q*Number(p.buyingPrice||0)}});
 return s;
}
function invFiltered(){
 var q=INV.q.trim().toLowerCase();
 return S.products.filter(function(p){
  if(INV.st!=="all"&&prodStatus(p)!==INV.st)return false;
  if(INV.cat&&(p.categoryName||"")!==INV.cat)return false;
  if(!q)return true;
  return (p.name||"").toLowerCase().indexOf(q)>-1||String(p.barcode||"").toLowerCase().indexOf(q)>-1||String(p.sku||"").toLowerCase().indexOf(q)>-1;
 }).sort(function(a,b){return (a.name||"").localeCompare(b.name||"")});
}

function rRange(per){
 var td=sod(new Date()),s,e=new Date(td.getFullYear(),td.getMonth(),td.getDate(),23,59,59,999);
 if(per==="0")s=td;else if(per==="7")s=addD(td,-6);else if(per==="30")s=addD(td,-29);
 else if(per==="m")s=new Date(td.getFullYear(),td.getMonth(),1);

 return{s:s,e:e,days:Math.max(1,Math.round((sod(e)-sod(s))/864e5)+1)};
}

 var o={n:l.length,rev:0,profit:0,qty:0,tax:0,disc:0,days:{},pay:{},prod:{},wd:[0,0,0,0,0,0,0],hr:[],sales:l};
 var pm={};S.products.forEach(function(p){pm[String(p.id)]=p});

 l.forEach(function(s){
  var t=Number(s.total||0),d=pdate(s.createdAt),k=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);

   var nm=i.productName||"—",q=Number(i.quantity||0),v=Number(i.total!=null?i.total:q*Number(i.unitPrice||0)),pf=i.profit!=null?Number(i.profit):null;
   var x=o.prod[nm]||(o.prod[nm]={name:nm,qty:0,rev:0,profit:0,hp:false});x.qty+=q;x.rev+=v;if(pf!=null){x.profit+=pf;x.hp=true}o.qty+=q;

  });
 });
 o.cogs=o.rev-o.profit;o.margin=o.rev>0?o.profit/o.rev*100:0;o.avg=o.n?Math.round(o.rev/o.n):0;

}

 else if(per==="3m")s=new Date(td.getFullYear(),td.getMonth()-2,1);

function isCash(m){return /cash/i.test(m||"cash")}
function cfCalc(r){
 var o={inn:0,out:0,inC:0,inM:0,outC:0,outM:0,days:{},nIn:0,nOut:0};
 var day=function(k){return o.days[k]||(o.days[k]={i:0,o:0})};
 S.sales.forEach(function(s){var d=pdate(s.createdAt);if(!d||d<r.s||d>r.e)return;var v=Number(s.total||0);o.inn+=v;o.nIn++;day(ymd(d)).i+=v;if(isCash(s.paymentMethod))o.inC+=v;else o.inM+=v});
 (REP.exp||[]).forEach(function(e){var d=eDate(e);if(d<r.s||d>r.e)return;var v=Number(e.amount||0);o.out+=v;o.nOut++;day(ymd(d)).o+=v;if(isCash(e.paymentMethod))o.outC+=v;else o.outM+=v});
 o.net=o.inn-o.out;return o;
}

 S.sales.forEach(function(x){var d=pdate(x.createdAt);if(!d||d<a||d>b)return;var v=Number(x.total||0);n++;if(isCash(x.paymentMethod))cash+=v;else momo+=v});
